# A device base following the device layer of linux-phone-oco/docs at the release named here: the statements a
# device base runs, and the part of tables.toml between the device:begin and device:end lines (bin/follow.sh of
# ideal-knowledge-base lays them; its job moves the pin). own names the files this base keeps as its own, each
# with its reason under [why]. parts is the version of the parts contract that docs validates what it pulls against.
source = "linux-phone-oco/docs"
version = "0.18.0"
own = []
parts = 1
steps = 1

# Why each own file is kept (bin/check-own.sh in ideal-knowledge-base reads it): a reason, or upstream:ITEM.
[why]
