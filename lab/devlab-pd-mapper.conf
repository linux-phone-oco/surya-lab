# The ADSP boots before the in-kernel PD mapper is loaded, now and then (8 of 42 health runs had no sound card);
# the ADSP sometimes boots before the in-kernel PD mapper is loaded,
# and its audio PD then never comes up (no sound card). Load the PD mapper before the remoteproc driver.
softdep qcom_q6v5_pas pre: qcom_pd_mapper
