SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"
	EnableSequence [
		# two amps share one I2S line: each takes its own channel (the tas2564 at 0x4d is the
		# top speaker, labelled Left in the device tree; the tas2562 at 0x4c is the bottom one)
		cset "name='Left ASI1 Sel' Left"
		cset "name='Right ASI1 Sel' Right"
		# the amplifiers' own digital volume at 0 dB (110 of 0..110); the user's volume is
		# PipeWire's. Images that restore a saved mixer state can leave it at -110 dB (silence).
		cset "name='Left Digital Volume Control' 110"
		cset "name='Right Digital Volume Control' 110"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
