SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		# capture: the WCD9375 over the TX SoundWire bus, through the DSP's TX_CODEC_DMA_TX_3, into MultiMedia2
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Earpiece"
	]
	EnableSequence [
		# two amps share one I2S line: each takes its own channel (the tas2564 at 0x4d is the
		# top speaker, labelled Left in the device tree; the tas2562 at 0x4c is the bottom one)
		cset "name='Left ASI1 Sel' Left"
		cset "name='Right ASI1 Sel' Right"
		# the amplifiers' own digital volume at 0 dB (110 of 0..110); the user's volume is
		# PipeWire's. Images that restore a saved mixer state can leave it at -110 dB (silence).
		cset "name='Left Digital Volume Control' 110"
		cset "name='Right Digital Volume Control' 110"
	]
	Value {
		# above PulseAudio's 9900 for analog outputs: Sxmo loads a loopback card (snd-aloop) that
		# registers before this one at boot and would otherwise become the default output - silence
		PlaybackPriority 10000
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# The microphones are analog, on the WCD9375 (proven 2026-11-17 by the phone's own mic-hears-speaker):
# the bottom one on AMIC1 -> ADC1 (mic bias 1), the top one on AMIC3 -> ADC2 at its INP3 input (mic bias 3).
# Each reaches the TX macro over SoundWire (ADC1 as SWR_ADC0, ADC2 as SWR_ADC2) and is decimated by DEC0.
# Gains as in the passing checks: the codec's ADC at 18 of 20, the decimator at +20 dB (104).

SectionDevice."Mic" {
	Comment "Bottom microphone"

	ConflictingDevice [
		"TopMic"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 18"
		cset "name='TX_DEC0 Volume' 104"
	]

	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		# above the loopback card's 9900 (Sxmo loads snd-aloop), as the speaker's PlaybackPriority
		CapturePriority 10000
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}

SectionDevice."TopMic" {
	Comment "Top microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC2"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2 Volume' 18"
		cset "name='TX_DEC0 Volume' 104"
	]

	DisableSequence [
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 9950
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}

# The earpiece is the top speaker: the TAS2564 at 0x4d (the amplifier labelled Left), which plays the left
# channel as half of the stereo pair. The WCD9375's EAR amplifier is not connected to anything one hears
# (its whole path powers on at full gain; the author heard nothing, 2026-11-17). As the earpiece, the top
# amplifier takes both channels mixed (a mono call reaches it whole) at -18 dB, and the bottom one is silent.
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Left ASI1 Sel' LeftRightDiv2"
		cset "name='Left Digital Volume Control' 92"
		cset "name='Right Digital Volume Control' 0"
	]

	DisableSequence [
		cset "name='Left ASI1 Sel' Left"
		cset "name='Left Digital Volume Control' 110"
		cset "name='Right Digital Volume Control' 110"
	]

	Value {
		PlaybackPriority 9000
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
