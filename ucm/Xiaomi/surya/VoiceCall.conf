# A modem call on surya. The DSP mixes the call itself (q6voice): the downlink goes to the TAS amplifiers on
# TERT_MI2S_RX, the uplink comes from the WCD9375 on TX_CODEC_DMA_TX_3. q6voiced opens the hostless
# VoiceMMode1 PCM (hw:0,6) while a call is up; devlab-call-uplink keeps a 1-channel capture running on
# MultiMedia3 from the same port, which the uplink needs (pulpoff/linux-surya). The TX topology is set to
# no processing (0x10F70): the default single-mic echo/noise suppression (0x10F71) sends silence without
# Xiaomi's calibration (pulpoff/linux-surya).

SectionVerb {
	EnableSequence [
		# the PCMs PulseAudio opens in this verb need their routes too: it drops a verb whose devices fail to open
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='VoiceMMode1 TX Topology' 69488"
		cset "name='TERT_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		# the bottom microphone (WCD9375 ADC1 -> DEC0): the uplink
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 18"
		cset "name='TX_DEC0 Volume' 104"
	]
	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='TERT_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]
	Value {
		TQ "Voice"
	}
}

# the earpiece is the top speaker (TAS2564, the amplifier labelled Left), both channels mixed, -18 dB
SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Left ASI1 Sel' LeftRightDiv2"
		cset "name='Left Digital Volume Control' 92"
		cset "name='Right Digital Volume Control' 0"
	]
	DisableSequence [
		cset "name='Left ASI1 Sel' Left"
		cset "name='Left Digital Volume Control' 110"
		cset "name='Right Digital Volume Control' 110"
	]
	Value {
		PlaybackPriority 10000
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# speakerphone: both amplifiers, each its channel, at 0 dB
SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Earpiece"
	]
	EnableSequence [
		cset "name='Left ASI1 Sel' Left"
		cset "name='Right ASI1 Sel' Right"
		cset "name='Left Digital Volume Control' 110"
		cset "name='Right Digital Volume Control' 110"
	]
	Value {
		PlaybackPriority 9000
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Bottom microphone"
	Value {
		CapturePriority 10000
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
