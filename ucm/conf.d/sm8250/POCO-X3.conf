# Use case configuration for Xiaomi POCO X3 (surya): music and calls.
# Replaces alsa-ucm-conf's conf.d/sm8250/POCO X3.conf, which lists HiFi only (put by every flash).

Syntax 3

SectionUseCase."HiFi" {
	File "/Xiaomi/surya/HiFi.conf"
	Comment "HiFi quality Music."
}

SectionUseCase."Voice Call" {
	File "/Xiaomi/surya/VoiceCall.conf"
	Comment "Phone call."
}
